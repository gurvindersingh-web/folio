name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-folio/package-lock.json

      - name: Install dependencies
        working-directory: my-folio
        run: npm ci

      - name: Build project
        working-directory: my-folio
        run: npm run build
