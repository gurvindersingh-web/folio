    <meta name="theme-color" content="#1e1e1e" />
    <script>
      (() => {
        const key = 'portfolio-theme';
        const lightTheme = '#f3efe7';
        const darkTheme = '#1e1e1e';
        let storedTheme = null;
        try {
          storedTheme = localStorage.getItem(key);
        } catch {}
        const systemTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        const theme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : systemTheme;
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? lightTheme : darkTheme);
      })();
    </script>

    <!-- First-paint intro. Inlined so the overlay is visible on the very first
         frame, before the JS bundle loads. React takes over / removes it. -->
    <style>
      @font-face {
        font-family: 'Playfair Display';
        font-style: normal;
        font-display: swap;
        font-weight: 400 900;
        src: url('/fonts/playfair-display-latin-wght-normal.woff2') format('woff2-variations');
      }

      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-display: swap;
        font-weight: 100 800;
        src: url('/fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2-variations');
      }

      html.ink-intro-locked,
      html.ink-intro-locked body {
        overflow: hidden;
      }

      #ink-intro-boot {
        position: fixed;
        inset: 0;
        z-index: 99999;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: contain;
        background-color: #d3cdbd;
      }

      html[data-theme='light'] #ink-intro-boot {
        background-color: #d8ccb8;
      }

      #ink-intro-boot .ink-banner {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }

      #ink-intro-boot .ink-content {
        display: grid;
        justify-items: center;
        gap: 2.5rem;
        text-align: center;
      }

      #ink-intro-boot .ink-title {
        margin: 0;
        font-family: 'Playfair Display', serif;
        font-size: clamp(4.75rem, 9vw, 8.5rem);
        font-weight: 500;
        line-height: 0.92;
        letter-spacing: -0.01em;
        color: #121212;
      }

      html[data-theme='light'] #ink-intro-boot .ink-title {
        color: #171613;
      }

      #ink-intro-boot .ink-content > p {
        margin: 0;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #333333;
      }

      html[data-theme='light'] #ink-intro-boot .ink-content > p {
        color: #5b574e;
      }
    </style>

  <body>
    <!-- Static intro so it shows on the very first paint (before React boots).
         InkIntro.jsx renders the live version and calls __dismissInkIntroBoot. -->
    <div id="ink-intro-boot">
      <div class="ink-banner">
        <div class="ink-content">
          <h1 class="ink-title">Gurvinder<br />Singh</h1>
          <p>@ gurvindersingh-web</p>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const boot = document.getElementById('ink-intro-boot');
        const root = document.documentElement;
        root.classList.add('ink-intro-locked');

        let active = true;
        const dismiss = () => {
          if (!active) return;
          active = false;
          clearTimeout(failsafe);
          root.classList.remove('ink-intro-locked');
          boot.remove();
        };

        window.__dismissInkIntroBoot = dismiss;
        // Failsafe: if the bundle never boots, don't trap visitors on the intro.
        const failsafe = setTimeout(dismiss, 12000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
